{% extends "notifications/base.html" %}
{% block content %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #DDE6EF;border-radius:8px;font-size:14px;">
  <tr><td style="padding:10px 14px;color:#566577;width:90px;border-bottom:1px solid #DDE6EF;">الاسم</td><td style="padding:10px 14px;font-weight:bold;border-bottom:1px solid #DDE6EF;">{{ inquiry.name }}</td></tr>
  <tr><td style="padding:10px 14px;color:#566577;border-bottom:1px solid #DDE6EF;">WhatsApp</td><td style="padding:10px 14px;border-bottom:1px solid #DDE6EF;"><span dir="ltr" style="unicode-bidi:embed;">{{ inquiry.phone }}</span></td></tr>
  <tr><td style="padding:10px 14px;color:#566577;">الموضوع</td><td style="padding:10px 14px;font-weight:bold;">{{ inquiry.subject }}</td></tr>
</table>
<div style="margin-top:16px;font-size:12px;color:#566577;">نص الرسالة</div>
<div style="margin-top:6px;background:#F5F9FD;border-right:4px solid #15A7D7;border-radius:6px;padding:14px 16px;font-size:14px;line-height:1.9;color:#05285B;">{{ inquiry.body|linebreaksbr }}</div>
{% if whatsapp_url %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:16px;"><tr><td style="border:1px solid #0771C1;border-radius:6px;">
  <a href="{{ whatsapp_url }}" style="display:inline-block;padding:10px 18px;color:#0771C1;font-size:13px;font-weight:bold;text-decoration:none;">الرد عبر WhatsApp</a>
</td></tr></table>
{% endif %}
{% endblock %}

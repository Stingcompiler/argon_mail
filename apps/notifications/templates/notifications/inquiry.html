{% extends "notifications/base.html" %}
{% block content %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #E5E7E2;border-radius:8px;font-size:14px;">
  <tr><td style="padding:10px 14px;color:#778078;width:90px;border-bottom:1px solid #E5E7E2;">الاسم</td><td style="padding:10px 14px;font-weight:bold;border-bottom:1px solid #E5E7E2;">{{ inquiry.name }}</td></tr>
  <tr><td style="padding:10px 14px;color:#778078;border-bottom:1px solid #E5E7E2;">WhatsApp</td><td style="padding:10px 14px;border-bottom:1px solid #E5E7E2;"><span dir="ltr" style="unicode-bidi:embed;">{{ inquiry.phone }}</span></td></tr>
  <tr><td style="padding:10px 14px;color:#778078;">الموضوع</td><td style="padding:10px 14px;font-weight:bold;">{{ inquiry.subject }}</td></tr>
</table>
<div style="margin-top:16px;font-size:12px;color:#778078;">نص الرسالة</div>
<div style="margin-top:6px;background:#FAF8F2;border-right:4px solid #D9A441;border-radius:6px;padding:14px 16px;font-size:14px;line-height:1.9;color:#202923;">{{ inquiry.body|linebreaksbr }}</div>
{% if whatsapp_url %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:16px;"><tr><td style="border:1px solid #145A46;border-radius:6px;">
  <a href="{{ whatsapp_url }}" style="display:inline-block;padding:10px 18px;color:#145A46;font-size:13px;font-weight:bold;text-decoration:none;">الرد عبر WhatsApp</a>
</td></tr></table>
{% endif %}
{% endblock %}

# One web service runs the whole monolith (Next.js on $PORT, Gunicorn on
# 127.0.0.1:8000 and the e-mail alert worker), plus PostgreSQL and a 10 GB disk.
# Review plans and regions before applying; nothing here is deployed yet.
services:
  - type: web
    name: arjoon-mail
    runtime: python
    plan: starter            # needs enough memory for Node + Gunicorn; persistent disks need a paid plan
    buildCommand: ./build.sh
    # Runs after a successful build, before the new version takes traffic.
    preDeployCommand: python manage.py migrate --noinput && python manage.py createcachetable
    startCommand: ./start.sh
    healthCheckPath: /api/v1/health/
    disk:
      name: arjoon-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: NODE_VERSION
        value: "22"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true  # must differ from DJANGO_SECRET_KEY (checked at startup)
      - key: DEFAULT_ALERT_EMAILS
        value: preedargon@gmail.com  # used until recipients are set in the dashboard
      - key: ENABLE_DJANGO_ADMIN
        value: "false"
      - key: HEALTH_REQUIRE_WORKER
        value: "true"
      - key: HEALTH_REQUIRE_DATA_MOUNT
        value: "true"
      - key: SENTRY_DSN
        sync: false          # optional; errors are reported to Sentry when set
      - key: DATABASE_URL
        fromDatabase:
          name: arjoon-db
          property: connectionString
      - key: DATA_ROOT
        value: /var/data
      - key: SITE_URL
        sync: false          # e.g. https://arjoon.example
      - key: TRUSTED_ORIGINS
        sync: false          # same as SITE_URL (comma separated if several)
      - key: DJANGO_ALLOWED_HOSTS
        value: 127.0.0.1,localhost
      - key: EMAIL_URL
        sync: false          # smtp+tls://user:pass@host:587 from the chosen mail provider
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: NUM_PROXIES
        value: "1"           # Render LB appends the client IP; Next.js forwards XFF unchanged. Verify after first deploy
databases:
  - name: arjoon-db
    plan: basic-256mb
    postgresMajorVersion: "16"
